[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS: Real-Time Adaptive Digital Twin & Decision Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NEXUS Research Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "networkx>=3.4.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "prometheus-client>=0.20.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
python_files = "test_*.py"
pythonpath = [
    ".",
]

[tool.coverage.run]
source = ["gateway", "digital_twin", "anomaly_detection", "simulation", "agents", "streaming"]
omit = ["tests/*"]
