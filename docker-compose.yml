services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: nexus-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus-network

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: nexus-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT:-8443}:${GATEWAY_PORT:-8443}"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-network

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: nexus-consumer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - nexus-network

  twin-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.twin
    container_name: nexus-twin-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TWIN_API_PORT:-8000}:${TWIN_API_PORT:-8000}"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: nexus-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - twin-api
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
